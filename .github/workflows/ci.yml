name: CI — Compile & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Java 21 — Maven compile & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Debug environment
        run: |
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Maven: $(mvn -version 2>&1 | head -1)"
          echo "Working dir: $(pwd)"
          echo "pom.xml exists: $(ls -la pom.xml)"

      - name: Compile (full output)
        run: |
          mvn compile -DskipTests 2>&1
        env:
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_SUCCESS_URL: http://localhost:8080/stripe/success
          STRIPE_CANCEL_URL: http://localhost:8080/stripe/cancel
          STRIPE_CURRENCY: usd
          SWAGGER_TITLE: "Payment API"
          SWAGGER_DESCRIPTION: "CI"
          SWAGGER_VERSION: "1.0.0"
          SWAGGER_SERVER_URL: "http://localhost:8080"

      - name: Unit tests
        run: |
          mvn test \
            -Dtest="!TransactionR2dbcAdapterIT" \
            -Dsurefire.failIfNoSpecifiedTests=false
        env:
          APP_PORT: "8080"
          APP_NAME: yowyob-payment-ci
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: payment_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_POOL_MIN: "1"
          DB_POOL_MAX: "5"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KAFKA_GROUP_ID: payment-group-ci
          KERNEL_CLIENT_ID: ci-client
          KERNEL_API_KEY: ci-api-key
          KERNEL_TENANT_ID: ci-tenant
          REDIS_TTL_SECONDS: "3600"
          WITH_FEES: "false"
          FEE_TYPE: PERCENTAGE
          FEE_VALUE: "0"
          FEE_CURRENCY: XAF
          TRANSACTION_REFERENCE_PREFIX: TXN
          MIN_TRANSACTION_AMOUNT: "100"
          MAX_TRANSACTION_AMOUNT: "10000000"
          MAX_WALLET_BALANCE: "50000000"
          KAFKA_TOPIC_TRANSACTION_EVENTS: transaction-events
          KAFKA_TOPIC_WALLET_EVENTS: wallet-events
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_SUCCESS_URL: http://localhost:8080/stripe/success
          STRIPE_CANCEL_URL: http://localhost:8080/stripe/cancel
          STRIPE_CURRENCY: usd
          SWAGGER_TITLE: "Payment API"
          SWAGGER_DESCRIPTION: "CI"
          SWAGGER_VERSION: "1.0.0"
          SWAGGER_SERVER_URL: "http://localhost:8080"

      - name: Integration tests (Testcontainers)
        run: |
          mvn test \
            -Dtest="TransactionR2dbcAdapterIT" \
            -Dsurefire.failIfNoSpecifiedTests=false
        env:
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_SUCCESS_URL: http://localhost:8080/stripe/success
          STRIPE_CANCEL_URL: http://localhost:8080/stripe/cancel
          STRIPE_CURRENCY: usd
          SWAGGER_TITLE: "Payment API"
          SWAGGER_DESCRIPTION: "CI"
          SWAGGER_VERSION: "1.0.0"
          SWAGGER_SERVER_URL: "http://localhost:8080"

      - name: Test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Results
          path: "**/target/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
