name: Notify yowyob mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch mirror sync
        env:
          TOKEN: ${{ secrets.YOWYOB_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "no token, skip"; exit 0; fi
          curl -sf -X POST -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yowyob/payment-service-dev/dispatches \
            -d "{\"event_type\":\"upstream-push\"}" && echo dispatched
