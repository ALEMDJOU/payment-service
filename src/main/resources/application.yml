server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: ${APP_NAME:yowyob-payment}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: ${DB_POOL_MIN:2}
      max-size: ${DB_POOL_MAX:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:payment-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

yowyob:
  kernel:
    base-url: ${KERNEL_BASE_URL:https://kernel-core.yowyob.com}
    client-id: ${KERNEL_CLIENT_ID:payment-service}
    api-key: ${KERNEL_API_KEY:dev-api-key}
    tenant-id: ${KERNEL_TENANT_ID:default}
    jwks-uri: ${KERNEL_BASE_URL:https://kernel-core.yowyob.com}/.well-known/jwks.json
    issuer: ${KERNEL_ISSUER:${KERNEL_BASE_URL:https://kernel-core.yowyob.com}}
    permissions:
      admin: ${PAYMENTS_ADMIN_PERMISSIONS:payments:admin}
  redis:
    ttl-seconds: ${REDIS_TTL_SECONDS:3600}
  fees:
    enabled: ${WITH_FEES:false}
    type: ${FEE_TYPE:PERCENTAGE}
    value: ${FEE_VALUE:0}
    currency: ${FEE_CURRENCY:XAF}
  transaction:
    reference-prefix: ${TRANSACTION_REFERENCE_PREFIX:TXN}
    min-amount: ${MIN_TRANSACTION_AMOUNT:100}
    max-amount: ${MAX_TRANSACTION_AMOUNT:10000000}
    max-wallet-balance: ${MAX_WALLET_BALANCE:50000000}
  kafka:
    topic-transaction-events: ${KAFKA_TOPIC_TRANSACTION_EVENTS:transaction-events}
    topic-wallet-events: ${KAFKA_TOPIC_WALLET_EVENTS:wallet-events}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/stripe/success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/stripe/cancel}
    currency: ${STRIPE_CURRENCY:usd}
  webhook:
    max-attempts: ${WEBHOOK_MAX_ATTEMPTS:5}
    initial-delay-ms: ${WEBHOOK_INITIAL_DELAY_MS:1000}
    multiplier: ${WEBHOOK_RETRY_MULTIPLIER:2}
    poll-interval-ms: ${WEBHOOK_POLL_INTERVAL_MS:5000}
    timeout-ms: ${WEBHOOK_TIMEOUT_MS:10000}
    batch-size: ${WEBHOOK_BATCH_SIZE:20}
  swagger:
    title: ${SWAGGER_TITLE:Yowyob Payment API}
    description: ${SWAGGER_DESCRIPTION:API de gestion des paiements}
    version: ${SWAGGER_VERSION:1.0.0}
    server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.yowyob.payment: INFO
